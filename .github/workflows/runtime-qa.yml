name: Runtime QA 1.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "mobile.js"
      - "mobile.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "build-info.json"
      - "shared/**"
      - "qa/**"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check public runtime
        shell: bash
        run: |
          node --check mobile.js
          find shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check qa/public-qa.mjs
      - name: PWA build invariants
        shell: bash
        run: |
          grep -q '"version": "1.3.0"' build-info.json
          grep -q 'nvd-1.3.0' sw.js
          ! grep -q '__CACHE__' sw.js
          ! grep -q '__ASSETS__' sw.js
          ! grep -q '../shared/' mobile.js
      - name: Engine QA
        run: node qa/public-qa.mjs
