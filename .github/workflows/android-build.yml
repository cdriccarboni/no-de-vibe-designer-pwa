name: Android Test & Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: npm ci
      - name: Core tests
        run: npm test
      - name: Sync Capacitor
        run: npm run android:sync
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: No-de-Vibe-Designer-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.NVD_UPLOAD_KEYSTORE_B64 }}
      NVD_UPLOAD_STORE_PASSWORD: ${{ secrets.NVD_UPLOAD_STORE_PASSWORD }}
      NVD_UPLOAD_KEY_ALIAS: ${{ secrets.NVD_UPLOAD_KEY_ALIAS }}
      NVD_UPLOAD_KEY_PASSWORD: ${{ secrets.NVD_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check signing material
        id: signing
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$NVD_UPLOAD_STORE_PASSWORD" ] && [ -n "$NVD_UPLOAD_KEY_ALIAS" ] && [ -n "$NVD_UPLOAD_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Stable signed release skipped: NVD_UPLOAD_* signing secrets are not configured."
          fi
      - name: Install
        if: steps.signing.outputs.configured == 'true'
        run: npm ci
      - name: Decode upload keystore
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nvd-upload.jks"
          echo "NVD_UPLOAD_STORE_FILE=$RUNNER_TEMP/nvd-upload.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        if: steps.signing.outputs.configured == 'true'
        run: npm run android:apk:release
      - name: Build signed AAB
        if: steps.signing.outputs.configured == 'true'
        run: npm run android:aab
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: No-de-Vibe-Designer-android-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
