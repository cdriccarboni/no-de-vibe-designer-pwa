name: Android 1.3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "mobile.js"
      - "mobile.css"
      - "manifest.webmanifest"
      - "shared/**"
      - "icons/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Prepare Capacitor builder
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/android@8.5.2

          rm -rf www android
          mkdir -p www

          rsync -a ./ www/             --exclude ".git"             --exclude ".github"             --exclude "node_modules"             --exclude "www"             --exclude "android"             --exclude "package.json"             --exclude "package-lock.json"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "fr.acousmatic.nodevibedesigner",
            "appName": "No-de Vibe Designer",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Align Android version
        shell: bash
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode 130/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.3.0"/' android/app/build.gradle
          grep -nE 'applicationId|versionCode|versionName' android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build unsigned release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: No-de-Vibe-Designer-1.3.0-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: No-de-Vibe-Designer-1.3.0-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
