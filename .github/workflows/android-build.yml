name: Android 1.3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "mobile.js"
      - "mobile.css"
      - "manifest.webmanifest"
      - "shared/**"
      - "icons/**"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Capacitor builder
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/android@8.5.2

          rm -rf www android
          mkdir -p www

          rsync -a ./ www/             --exclude ".git"             --exclude ".github"             --exclude "node_modules"             --exclude "www"             --exclude "android"             --exclude "package.json"             --exclude "package-lock.json"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "fr.acousmatic.nodevibedesigner",
            "appName": "No-de Vibe Designer",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Align Android version
        shell: bash
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode 130/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.3.0"/' android/app/build.gradle
          grep -nE 'applicationId|versionCode|versionName' android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          {
            echo "No-de Vibe Designer 1.3.0"
            echo
            "$AAPT" dump badging "$APK" | grep -E '^package:|^application-label:|^sdkVersion:|^targetSdkVersion:' || true
            echo
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          } | tee android-verification.txt

      - name: Build unsigned release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: No-de-Vibe-Designer-1.3.0-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: No-de-Vibe-Designer-1.3.0-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      - name: Publish downloadable binaries
        if: ${{ success() }}
        shell: bash
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/No-de-Vibe-Designer-1.3.0-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab downloads/No-de-Vibe-Designer-1.3.0-unsigned.aab
          cp android-verification.txt downloads/android-verification.txt
          printf '%s\n' '# Android downloads' ''             '- APK test: No-de-Vibe-Designer-1.3.0-debug.apk'             '- AAB release: No-de-Vibe-Designer-1.3.0-unsigned.aab (non signé, non publiable sur Play tel quel)'             > downloads/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish No-de 1.3.0 binaries"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
