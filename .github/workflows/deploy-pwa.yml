name: Deploy No-de PWA (public HTTPS)

# Primary path today: scripts/deploy-pwa.mjs → public GitHub Pages publish repo
#   https://cdriccarboni.github.io/no-de-vibe-designer-pwa/
# Cloudflare Pages (ART pattern) activates when secrets exist:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "mobile/**"
      - "shared/**"
      - "scripts/build-pwa.mjs"
      - "scripts/deploy-pwa.mjs"
      - "package.json"
      - ".github/workflows/deploy-pwa.yml"

concurrency:
  group: nvd-pwa-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:pwa
      - name: Verify PWA output
        run: |
          test -f dist/pwa/index.html
          test -f dist/pwa/sw.js
          test -f dist/pwa/manifest.webmanifest
          test -f dist/pwa/build-info.json
          grep -q '"version"' dist/pwa/build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: no-de-pwa
          path: dist/pwa
          if-no-files-found: error

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: no-de-pwa
          path: dist/pwa
      - name: Cloudflare not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare secrets absent — GitHub Pages publish path remains available."
      - name: Deploy Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4 pages deploy dist/pwa --project-name=no-de-vibe-designer --branch=main --commit-dirty=true
