name: Build Android from Public PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "mobile/**"
      - "shared/**"
      - "studio/**"
      - "companion/**"
      - "icons/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "build-info.json"
      - ".github/workflows/android-pwa-build.yml"

permissions:
  contents: write

concurrency:
  group: public-android-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Syntax check PWA runtime
        run: node --check desktop/app.js && node --check shared/device-manager.js
      - name: Prepare Capacitor wrapper
        shell: bash
        run: |
          cat > package.json <<'JSON'
          {
            "name": "no-de-vibe-designer-android-public",
            "private": true,
            "version": "1.3.6",
            "dependencies": {
              "@capacitor/android": "8.5.2",
              "@capacitor/cli": "8.5.2",
              "@capacitor/core": "8.5.2"
            }
          }
          JSON
          npm install --no-audit --no-fund
          mkdir -p www
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='downloads' --exclude='node_modules' --exclude='android' --exclude='www' ./ www/
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "fr.acousmatic.nodevibedesigner",
            "appName": "No-de Vibe Designer",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android
          npx cap sync android
      - name: Set Android version and permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=s.replace('versionCode 1','versionCode 136')
          s=s.replace('versionName "1.0"','versionName "1.3.6"')
          p.write_text(s)
          m=Path("android/app/src/main/AndroidManifest.xml")
          x=m.read_text()
          perms=[
            'android.permission.CAMERA',
            'android.permission.RECORD_AUDIO',
            'android.permission.VIBRATE',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.BLUETOOTH_CONNECT',
            'android.permission.BLUETOOTH_SCAN'
          ]
          marker='<uses-permission android:name="android.permission.INTERNET" />'
          extra='\n'.join(f'<uses-permission android:name="{p}" />' for p in perms)
          if extra not in x:
              x=x.replace(marker, marker+'\n'+extra)
          m.write_text(x)
          PY
      - name: Build APK and unsigned AAB
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Prepare downloads
        shell: bash
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/No-de-Vibe-Designer-1.3.6-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab downloads/No-de-Vibe-Designer-1.3.6-unsigned.aab
          cat > downloads/android-verification-1.3.6.txt <<'TXT'
          No-de Vibe Designer 1.3.6
          package: fr.acousmatic.nodevibedesigner
          versionCode: 136
          versionName: 1.3.6
          APK: debug/test signature
          AAB: unsigned — do not upload to Play
          Source: public PWA build-info 1.3.6
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: No-de-Vibe-Designer-1.3.6-Android
          path: |
            downloads/No-de-Vibe-Designer-1.3.6-debug.apk
            downloads/No-de-Vibe-Designer-1.3.6-unsigned.aab
            downloads/android-verification-1.3.6.txt
      - name: Publish direct downloads
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/No-de-Vibe-Designer-1.3.6-debug.apk downloads/No-de-Vibe-Designer-1.3.6-unsigned.aab downloads/android-verification-1.3.6.txt
          if git diff --cached --quiet; then
            echo "No download changes"
          else
            git commit -m "build(android): publish No-de 1.3.6 test binaries [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
