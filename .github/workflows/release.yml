    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve version
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' shared/version.js | head -1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - name: Prepare Electron wrapper
        shell: bash
        run: |
          cat > package.json <<JSON
          {"name":"no-de-vibe-designer-universal","productName":"No-de Vibe Designer","version":"${APP_VERSION}","private":true,"author":{"name":"Cédric Carboni","email":"cdriccarboni@users.noreply.github.com"},"main":"electron/main.cjs","devDependencies":{"electron":"33.4.11","electron-builder":"25.1.8"},"build":{"appId":"fr.acousmatic.nodevibedesigner","productName":"No-de Vibe Designer","asar":true,"files":["electron/**/*","desktop/**/*","shared/**/*","src/**/*","mobile/**/*","studio/**/*","companion/**/*","show/**/*","manuel/**/*","icons/**/*","install/**/*","index.html","manifest.webmanifest","build-info.json","package.json"],"win":{"target":[{"target":"nsis","arch":["x64"]}],"artifactName":"No-de-Vibe-Designer-${APP_VERSION}-Windows-x64-Setup.exe"},"nsis":{"oneClick":false,"allowToChangeInstallationDirectory":true,"createDesktopShortcut":true,"createStartMenuShortcut":true}}}
          JSON
          mkdir -p electron
          cat > electron/main.cjs <<'JS'
          const { app, BrowserWindow, shell, session } = require("electron");
          const http = require("http"), fs = require("fs"), path = require("path");
          let server;
          function root(){ return app.isPackaged ? path.join(process.resourcesPath,"app.asar") : path.join(__dirname,".."); }
          function type(p){ const e=path.extname(p).toLowerCase(); return ({".html":"text/html; charset=utf-8",".js":"text/javascript; charset=utf-8",".mjs":"text/javascript; charset=utf-8",".css":"text/css; charset=utf-8",".json":"application/json; charset=utf-8",".svg":"image/svg+xml",".png":"image/png",".jpg":"image/jpeg",".jpeg":"image/jpeg",".webmanifest":"application/manifest+json",".wasm":"application/wasm"})[e]||"application/octet-stream"; }
          async function create(){ const r=root(); const port=await new Promise((resolve,reject)=>{server=http.createServer((req,res)=>{let rel=decodeURIComponent((req.url||"/").split("?")[0]).replace(/^\/+/, "")||"index.html";let p=path.normalize(path.join(r,rel));if(!p.startsWith(path.normalize(r))){res.writeHead(403);return res.end("Forbidden");}try{if(fs.statSync(p).isDirectory())p=path.join(p,"index.html");}catch{}if(!fs.existsSync(p)){res.writeHead(404);return res.end("Not found");}res.writeHead(200,{"Content-Type":type(p),"Cache-Control":"no-cache"});fs.createReadStream(p).pipe(res);});server.on("error",reject);server.listen(0,"127.0.0.1",()=>resolve(server.address().port));}); const win=new BrowserWindow({width:1440,height:930,minWidth:1024,minHeight:700,title:"No-de Vibe Designer",backgroundColor:"#101214",webPreferences:{contextIsolation:true,nodeIntegration:false,sandbox:true}}); session.defaultSession.setPermissionRequestHandler((_wc,p,cb)=>cb(p==="media"||p==="geolocation"||p==="notifications")); await win.loadURL("http://127.0.0.1:"+port+"/desktop/"); win.webContents.setWindowOpenHandler(({url})=>{if(url.startsWith("http://127.0.0.1:"+port+"/"))return{action:"allow"};shell.openExternal(url);return{action:"deny"};}); }
          app.whenReady().then(create); app.on("window-all-closed",()=>{try{server?.close()}catch{};app.quit();});
          JS
          npm install --no-audit --no-fund
      - name: Build Windows installer and portable archive
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --win nsis --x64 --publish never
          mkdir -p release-assets
          cp "dist/No-de-Vibe-Designer-${APP_VERSION}-Windows-x64-Setup.exe" release-assets/
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath 'release-assets/No-de-Vibe-Designer-${APP_VERSION}-Windows-x64-portable.zip' -Force"
          (cd release-assets && sha256sum * > SHA256SUMS-Windows.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve version
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' shared/version.js | head -1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - name: Prepare Electron wrapper
        shell: bash
        run: |
          cat > package.json <<JSON
          {"name":"no-de-vibe-designer-universal","productName":"No-de Vibe Designer","version":"${APP_VERSION}","private":true,"author":{"name":"Cédric Carboni","email":"cdriccarboni@users.noreply.github.com"},"main":"electron/main.cjs","devDependencies":{"electron":"33.4.11","electron-builder":"25.1.8"},"build":{"appId":"fr.acousmatic.nodevibedesigner","productName":"No-de Vibe Designer","asar":true,"files":["electron/**/*","desktop/**/*","shared/**/*","src/**/*","mobile/**/*","studio/**/*","companion/**/*","show/**/*","manuel/**/*","icons/**/*","install/**/*","index.html","manifest.webmanifest","build-info.json","package.json"],"linux":{"target":["AppImage","deb","tar.gz"],"category":"Graphics","artifactName":"No-de-Vibe-Designer-${APP_VERSION}-Linux-x64.\${ext}"}}}
          JSON
          mkdir -p electron
          cat > electron/main.cjs <<'JS'
          const { app, BrowserWindow, shell, session } = require("electron");
          const http = require("http"), fs = require("fs"), path = require("path");
          let server;
          function root(){ return app.isPackaged ? path.join(process.resourcesPath,"app.asar") : path.join(__dirname,".."); }
          function type(p){ const e=path.extname(p).toLowerCase(); return ({".html":"text/html; charset=utf-8",".js":"text/javascript; charset=utf-8",".mjs":"text/javascript; charset=utf-8",".css":"text/css; charset=utf-8",".json":"application/json; charset=utf-8",".svg":"image/svg+xml",".png":"image/png",".jpg":"image/jpeg",".jpeg":"image/jpeg",".webmanifest":"application/manifest+json",".wasm":"application/wasm"})[e]||"application/octet-stream"; }
          async function create(){ const r=root(); const port=await new Promise((resolve,reject)=>{server=http.createServer((req,res)=>{let rel=decodeURIComponent((req.url||"/").split("?")[0]).replace(/^\/+/, "")||"index.html";let p=path.normalize(path.join(r,rel));if(!p.startsWith(path.normalize(r))){res.writeHead(403);return res.end("Forbidden");}try{if(fs.statSync(p).isDirectory())p=path.join(p,"index.html");}catch{}if(!fs.existsSync(p)){res.writeHead(404);return res.end("Not found");}res.writeHead(200,{"Content-Type":type(p),"Cache-Control":"no-cache"});fs.createReadStream(p).pipe(res);});server.on("error",reject);server.listen(0,"127.0.0.1",()=>resolve(server.address().port));}); const win=new BrowserWindow({width:1440,height:930,minWidth:1024,minHeight:700,title:"No-de Vibe Designer",backgroundColor:"#101214",webPreferences:{contextIsolation:true,nodeIntegration:false,sandbox:true}}); session.defaultSession.setPermissionRequestHandler((_wc,p,cb)=>cb(p==="media"||p==="geolocation"||p==="notifications")); await win.loadURL("http://127.0.0.1:"+port+"/desktop/"); win.webContents.setWindowOpenHandler(({url})=>{if(url.startsWith("http://127.0.0.1:"+port+"/"))return{action:"allow"};shell.openExternal(url);return{action:"deny"};}); }
          app.whenReady().then(create); app.on("window-all-closed",()=>{try{server?.close()}catch{};app.quit();});
          JS
          npm install --no-audit --no-fund
      - name: Build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --linux AppImage deb tar.gz --x64 --publish never
          mkdir -p release-assets
          cp "dist/No-de-Vibe-Designer-${APP_VERSION}-Linux-x64.AppImage" release-assets/
          cp "dist/No-de-Vibe-Designer-${APP_VERSION}-Linux-x64.deb" release-assets/
          cp "dist/No-de-Vibe-Designer-${APP_VERSION}-Linux-x64.tar.gz" release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS-Linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: [android, macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' shared/version.js | head -1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$APP_VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or refresh universal GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "No-de Vibe Designer $APP_VERSION · Universal" \
              --notes "Build universel No[co]de : Web/PWA, macOS Apple Silicon + Intel, Windows x64, Linux x64 et Android. Toutes les variantes partagent le même runtime et le même format de projet." \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "No-de Vibe Designer $APP_VERSION · Universal" \
              --notes "Build universel No[co]de : Web/PWA, macOS Apple Silicon + Intel, Windows x64, Linux x64 et Android. Toutes les variantes partagent le même runtime et le même format de projet." \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
