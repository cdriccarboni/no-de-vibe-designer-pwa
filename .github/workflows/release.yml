name: Release No-de Vibe Designer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".release-trigger"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' shared/version.js | head -1)"
          test -n "$APP_VERSION"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Prepare Capacitor app
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/android@8.5.2
          rm -rf www android
          mkdir -p www
          rsync -a ./ www/ --exclude ".git" --exclude ".github" --exclude "node_modules" --exclude "www" --exclude "android" --exclude "downloads" --exclude "play" --exclude "package.json" --exclude "package-lock.json"
          cat > capacitor.config.json <<'JSON'
          {"appId":"fr.acousmatic.nodevibedesigner","appName":"No-de Vibe Designer","webDir":"www","bundledWebRuntime":false,"server":{"androidScheme":"https"},"android":{"allowMixedContent":true}}
          JSON
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
      - name: Build Android
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Sign Play AAB when configured
        if: ${{ env.PLAY_UPLOAD_KEYSTORE_B64 != '' && env.PLAY_UPLOAD_STORE_PASSWORD != '' && env.PLAY_UPLOAD_KEY_ALIAS != '' && env.PLAY_UPLOAD_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/no-de-play-upload.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          cp android/app/build/outputs/bundle/release/app-release.aab "No-de-Vibe-Designer-${APP_VERSION}-play.aab"
          jarsigner -keystore "$KEYSTORE" -storepass "$PLAY_UPLOAD_STORE_PASSWORD" -keypass "$PLAY_UPLOAD_KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 "No-de-Vibe-Designer-${APP_VERSION}-play.aab" "$PLAY_UPLOAD_KEY_ALIAS"
          jarsigner -verify -strict "No-de-Vibe-Designer-${APP_VERSION}-play.aab"
          rm -f "$KEYSTORE"
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/No-de-Vibe-Designer-Android-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/No-de-Vibe-Designer-${APP_VERSION}-Android-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/No-de-Vibe-Designer-${APP_VERSION}-unsigned.aab"
          if [ -f "No-de-Vibe-Designer-${APP_VERSION}-play.aab" ]; then cp "No-de-Vibe-Designer-${APP_VERSION}-play.aab" release-assets/; fi
          (cd release-assets && sha256sum * > SHA256SUMS-Android.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve version
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' shared/version.js | head -1)"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - name: Prepare Electron wrapper
        shell: bash
        run: |
          cat > package.json <<JSON
          {"name":"no-de-vibe-designer-mac-public","productName":"No-de Vibe Designer","version":"${APP_VERSION}","private":true,"main":"electron/main.cjs","devDependencies":{"electron":"33.4.11","electron-builder":"25.1.8"},"build":{"appId":"fr.acousmatic.nodevibedesigner","productName":"No-de Vibe Designer","asar":true,"files":["electron/**/*","desktop/**/*","shared/**/*","mobile/**/*","studio/**/*","companion/**/*","manuel/**/*","icons/**/*","index.html","manifest.webmanifest","build-info.json","package.json"],"mac":{"category":"public.app-category.graphics-design","identity":null,"target":[{"target":"zip","arch":["arm64"]}],"artifactName":"No-de-Vibe-Designer-${APP_VERSION}-arm64-mac.zip"}}}
          JSON
          mkdir -p electron
          cat > electron/main.cjs <<'JS'
          const { app, BrowserWindow, shell, session } = require("electron");
          const http = require("http"), fs = require("fs"), path = require("path");
          let server;
          function root(){ return app.isPackaged ? path.join(process.resourcesPath,"app.asar") : path.join(__dirname,".."); }
          function type(p){ const e=path.extname(p).toLowerCase(); return ({".html":"text/html; charset=utf-8",".js":"text/javascript; charset=utf-8",".mjs":"text/javascript; charset=utf-8",".css":"text/css; charset=utf-8",".json":"application/json; charset=utf-8",".svg":"image/svg+xml",".png":"image/png",".jpg":"image/jpeg",".jpeg":"image/jpeg",".webmanifest":"application/manifest+json"})[e]||"application/octet-stream"; }
          async function create(){ const r=root(); const port=await new Promise((resolve,reject)=>{server=http.createServer((req,res)=>{let rel=decodeURIComponent((req.url||"/").split("?")[0]).replace(/^\/+/, "")||"index.html";let p=path.normalize(path.join(r,rel));if(!p.startsWith(path.normalize(r))){res.writeHead(403);return res.end("Forbidden");}try{if(fs.statSync(p).isDirectory())p=path.join(p,"index.html");}catch{}if(!fs.existsSync(p)){res.writeHead(404);return res.end("Not found");}res.writeHead(200,{"Content-Type":type(p),"Cache-Control":"no-cache"});fs.createReadStream(p).pipe(res);});server.on("error",reject);server.listen(0,"127.0.0.1",()=>resolve(server.address().port));}); const win=new BrowserWindow({width:1440,height:930,minWidth:1024,minHeight:700,title:"No-de Vibe Designer",backgroundColor:"#101214",titleBarStyle:"hiddenInset",webPreferences:{contextIsolation:true,nodeIntegration:false,sandbox:true}}); session.defaultSession.setPermissionRequestHandler((_wc,p,cb)=>cb(p==="media"||p==="geolocation"||p==="notifications")); await win.loadURL("http://127.0.0.1:"+port+"/desktop/"); win.webContents.setWindowOpenHandler(({url})=>{if(url.startsWith("http://127.0.0.1:"+port+"/"))return{action:"allow"};shell.openExternal(url);return{action:"deny"};}); }
          app.whenReady().then(create); app.on("window-all-closed",()=>{try{server?.close()}catch{};app.quit();});
          JS
          npm install --no-audit --no-fund
      - name: Build macOS
        run: npx electron-builder --mac zip --arm64 --publish never
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp "dist/No-de-Vibe-Designer-${APP_VERSION}-arm64-mac.zip" release-assets/No-de-Vibe-Designer-macOS-arm64.zip
          cp "dist/No-de-Vibe-Designer-${APP_VERSION}-arm64-mac.zip" "release-assets/No-de-Vibe-Designer-${APP_VERSION}-macOS-arm64.zip"
          (cd release-assets && shasum -a 256 * > SHA256SUMS-macOS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: [android, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' shared/version.js | head -1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$APP_VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or refresh GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "No-de Vibe Designer $APP_VERSION" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* --title "No-de Vibe Designer $APP_VERSION" --generate-notes --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
