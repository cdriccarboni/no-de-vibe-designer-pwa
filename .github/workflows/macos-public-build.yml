name: Build macOS Test App from Public PWA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check PWA runtime
        run: node --check desktop/app.js && node --check shared/device-manager.js
      - name: Prepare Electron wrapper
        shell: bash
        run: |
          cat > package.json <<'JSON'
          {
            "name": "no-de-vibe-designer-mac-public",
            "productName": "No-de Vibe Designer",
            "version": "1.3.5",
            "private": true,
            "main": "electron/main.cjs",
            "devDependencies": {
              "electron": "33.4.11",
              "electron-builder": "25.1.8"
            },
            "build": {
              "appId": "fr.acousmatic.nodevibedesigner",
              "productName": "No-de Vibe Designer",
              "asar": true,
              "files": [
                "electron/**/*",
                "desktop/**/*",
                "shared/**/*",
                "mobile/**/*",
                "studio/**/*",
                "companion/**/*",
                "manuel/**/*",
                "icons/**/*",
                "index.html",
                "manifest.webmanifest",
                "build-info.json",
                "package.json"
              ],
              "mac": {
                "category": "public.app-category.graphics-design",
                "identity": null,
                "target": [{"target":"zip","arch":["arm64"]}],
                "artifactName": "No-de-Vibe-Designer-1.3.5-arm64-mac.zip"
              }
            }
          }
          JSON
          mkdir -p electron
          cat > electron/main.cjs <<'JS'
          const { app, BrowserWindow, shell, session } = require("electron");
          const http = require("http");
          const fs = require("fs");
          const path = require("path");
          let server;
          function root(){ return app.isPackaged ? path.join(process.resourcesPath,"app.asar") : path.join(__dirname,".."); }
          function type(p){ const e=path.extname(p).toLowerCase(); return ({".html":"text/html; charset=utf-8",".js":"text/javascript; charset=utf-8",".mjs":"text/javascript; charset=utf-8",".css":"text/css; charset=utf-8",".json":"application/json; charset=utf-8",".svg":"image/svg+xml",".png":"image/png",".jpg":"image/jpeg",".jpeg":"image/jpeg",".webmanifest":"application/manifest+json"})[e]||"application/octet-stream"; }
          function start(){
            const r=root();
            return new Promise((resolve,reject)=>{
              server=http.createServer((req,res)=>{
                let rel=decodeURIComponent((req.url||"/").split("?")[0]).replace(/^\/+/, "")||"index.html";
                let p=path.normalize(path.join(r,rel));
                if(!p.startsWith(path.normalize(r))){res.writeHead(403);return res.end("Forbidden");}
                try{ if(fs.statSync(p).isDirectory()) p=path.join(p,"index.html"); }catch{}
                if(!fs.existsSync(p)){res.writeHead(404);return res.end("Not found");}
                res.writeHead(200,{"Content-Type":type(p),"Cache-Control":"no-cache"});
                fs.createReadStream(p).pipe(res);
              });
              server.on("error",reject);
              server.listen(0,"127.0.0.1",()=>resolve(server.address().port));
            });
          }
          async function create(){
            const port=await start();
            const win=new BrowserWindow({width:1440,height:930,minWidth:1024,minHeight:700,title:"No-de Vibe Designer",backgroundColor:"#101214",titleBarStyle:"hiddenInset",trafficLightPosition:{x:14,y:16},webPreferences:{contextIsolation:true,nodeIntegration:false,sandbox:true}});
            session.defaultSession.setPermissionRequestHandler((_wc,p,cb)=>cb(p==="media"||p==="geolocation"||p==="notifications"));
            await win.loadURL("http://127.0.0.1:"+port+"/desktop/");
            win.webContents.setWindowOpenHandler(({url})=>{ if(url.startsWith("http://127.0.0.1:"+port+"/")) return {action:"allow"}; shell.openExternal(url); return {action:"deny"}; });
          }
          app.whenReady().then(create);
          app.on("window-all-closed",()=>{try{server?.close()}catch{};app.quit();});
          JS
          npm install --no-audit --no-fund
      - name: Build Apple Silicon zip
        run: npx electron-builder --mac zip --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: No-de-Vibe-Designer-1.3.5-macOS-arm64
          path: dist/*.zip
          if-no-files-found: error
