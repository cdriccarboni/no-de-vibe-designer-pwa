name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "desktop/**"
      - "mobile/**"
      - "studio/**"
      - "companion/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "build-info.json"
      - "shared/**"
      - ".github/workflows/macos-public-build.yml"

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve app version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' shared/version.js | head -1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Resolved No-de Vibe Designer $APP_VERSION"

      - name: Syntax check PWA runtime
        run: |
          node --check desktop/app.js
          node --check shared/device-manager.js
          node --check shared/surface-switcher.js

      - name: Prepare Electron wrapper
        shell: bash
        run: |
          cat > package.json <<JSON
          {
            "name": "no-de-vibe-designer-mac-public",
            "productName": "No-de Vibe Designer",
            "version": "$APP_VERSION",
            "private": true,
            "main": "electron/main.cjs",
            "devDependencies": {
              "electron": "33.4.11",
              "electron-builder": "25.1.8"
            },
            "build": {
              "appId": "fr.acousmatic.nodevibedesigner",
              "productName": "No-de Vibe Designer",
              "asar": true,
              "files": [
                "electron/**/*",
                "desktop/**/*",
                "shared/**/*",
                "mobile/**/*",
                "studio/**/*",
                "companion/**/*",
                "manuel/**/*",
                "icons/**/*",
                "index.html",
                "manifest.webmanifest",
                "build-info.json",
                "package.json"
              ],
              "mac": {
                "category": "public.app-category.graphics-design",
                "identity": null,
                "target": [{"target":"dir","arch":["arm64"]}]
              }
            }
          }
          JSON

          mkdir -p electron
          cat > electron/main.cjs <<'JS'
          const { app, BrowserWindow, shell, session } = require("electron");
          const http = require("http");
          const fs = require("fs");
          const path = require("path");

          let server;

          function root() {
            return app.isPackaged
              ? path.join(process.resourcesPath, "app.asar")
              : path.join(__dirname, "..");
          }

          function contentType(filePath) {
            const ext = path.extname(filePath).toLowerCase();
            return ({
              ".html": "text/html; charset=utf-8",
              ".js": "text/javascript; charset=utf-8",
              ".mjs": "text/javascript; charset=utf-8",
              ".css": "text/css; charset=utf-8",
              ".json": "application/json; charset=utf-8",
              ".svg": "image/svg+xml",
              ".png": "image/png",
              ".jpg": "image/jpeg",
              ".jpeg": "image/jpeg",
              ".webmanifest": "application/manifest+json"
            })[ext] || "application/octet-stream";
          }

          function startLocalServer() {
            const appRoot = root();
            return new Promise((resolve, reject) => {
              server = http.createServer((req, res) => {
                let rel = decodeURIComponent((req.url || "/").split("?")[0])
                  .replace(/^\/+/, "") || "index.html";
                let filePath = path.normalize(path.join(appRoot, rel));

                if (!filePath.startsWith(path.normalize(appRoot))) {
                  res.writeHead(403);
                  return res.end("Forbidden");
                }

                try {
                  if (fs.statSync(filePath).isDirectory()) {
                    filePath = path.join(filePath, "index.html");
                  }
                } catch {}

                if (!fs.existsSync(filePath)) {
                  res.writeHead(404);
                  return res.end("Not found");
                }

                res.writeHead(200, {
                  "Content-Type": contentType(filePath),
                  "Cache-Control": "no-cache"
                });
                fs.createReadStream(filePath).pipe(res);
              });

              server.on("error", reject);
              server.listen(0, "127.0.0.1", () => resolve(server.address().port));
            });
          }

          async function createWindow() {
            const port = await startLocalServer();
            const localOrigin = "http://127.0.0.1:" + port;

            const win = new BrowserWindow({
              width: 1440,
              height: 930,
              minWidth: 1024,
              minHeight: 700,
              title: "No-de Vibe Designer",
              backgroundColor: "#101214",
              titleBarStyle: "hiddenInset",
              trafficLightPosition: { x: 14, y: 16 },
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            session.defaultSession.setPermissionRequestHandler((_wc, permission, callback) => {
              callback(
                permission === "media" ||
                permission === "geolocation" ||
                permission === "notifications"
              );
            });

            await win.loadURL(localOrigin + "/desktop/");

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith(localOrigin + "/")) return { action: "allow" };
              shell.openExternal(url);
              return { action: "deny" };
            });
          }

          app.whenReady().then(createWindow);

          app.on("window-all-closed", () => {
            try { server?.close(); } catch {}
            app.quit();
          });
          JS

          npm install --no-audit --no-fund

      - name: Build unpacked Apple Silicon app
        run: npx electron-builder --mac dir --arm64 --publish never

      - name: Ad-hoc sign complete ARM64 bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="dist/mac-arm64/No-de Vibe Designer.app"

          test -d "$APP_DIR"
          xattr -cr "$APP_DIR" || true

          codesign --force --deep --sign - --timestamp=none "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          MAIN_BIN="$APP_DIR/Contents/MacOS/No-de Vibe Designer"
          file "$MAIN_BIN" | tee macos-architecture.txt
          file "$MAIN_BIN" | grep -qi "arm64"

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_DIR/Contents/Info.plist" | grep -qx "fr.acousmatic.nodevibedesigner"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_DIR/Contents/Info.plist" | grep -qx "$APP_VERSION"

      - name: Package signed ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="dist/mac-arm64/No-de Vibe Designer.app"
          ZIP="dist/No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.zip"
          DMG="dist/No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.dmg"
          STAGE="$RUNNER_TEMP/no-de-dmg"

          rm -rf "$STAGE" "$ZIP" "$DMG"
          mkdir -p "$STAGE"

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$ZIP"
          ditto "$APP_DIR" "$STAGE/No-de Vibe Designer.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create             -volname "No-de Vibe Designer"             -srcfolder "$STAGE"             -ov             -format UDZO             "$DMG"

          test -s "$ZIP"
          test -s "$DMG"

      - name: Verify packaged artifacts
        shell: bash
        run: |
          set -euo pipefail

          TMP_ZIP="$RUNNER_TEMP/no-de-zip-check"
          TMP_DMG="$RUNNER_TEMP/no-de-dmg-check"
          ZIP="dist/No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.zip"
          DMG="dist/No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.dmg"

          rm -rf "$TMP_ZIP" "$TMP_DMG"
          mkdir -p "$TMP_ZIP" "$TMP_DMG"

          ditto -x -k "$ZIP" "$TMP_ZIP"
          ZIP_APP="$TMP_ZIP/No-de Vibe Designer.app"
          codesign --verify --deep --strict --verbose=2 "$ZIP_APP"
          file "$ZIP_APP/Contents/MacOS/No-de Vibe Designer" | grep -qi "arm64"

          MOUNT_POINT="$(hdiutil attach "$DMG" -readonly -nobrowse | tail -1 | awk '{for(i=3;i<=NF;i++) printf "%s%s",$i,(i<NF?OFS:"") }')"
          test -d "$MOUNT_POINT/No-de Vibe Designer.app"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/No-de Vibe Designer.app"
          file "$MOUNT_POINT/No-de Vibe Designer.app/Contents/MacOS/No-de Vibe Designer" | grep -qi "arm64"
          hdiutil detach "$MOUNT_POINT"

      - name: Prepare stable aliases and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "dist/No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.zip" "dist/No-de-Vibe-Designer-macOS-arm64.zip"
          cp "dist/No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.dmg" "dist/No-de-Vibe-Designer-macOS-arm64.dmg"

          cd dist
          shasum -a 256             "No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.zip"             "No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.dmg"             "No-de-Vibe-Designer-macOS-arm64.zip"             "No-de-Vibe-Designer-macOS-arm64.dmg"             > SHA256SUMS-macOS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: No-de-Vibe-Designer-${{ env.APP_VERSION }}-macOS-arm64
          path: |
            dist/No-de-Vibe-Designer-${{ env.APP_VERSION }}-macOS-arm64.zip
            dist/No-de-Vibe-Designer-${{ env.APP_VERSION }}-macOS-arm64.dmg
            dist/No-de-Vibe-Designer-macOS-arm64.zip
            dist/No-de-Vibe-Designer-macOS-arm64.dmg
            dist/SHA256SUMS-macOS.txt
            macos-architecture.txt
          if-no-files-found: error

      - name: Create or refresh GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$APP_VERSION"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "No-de Vibe Designer $APP_VERSION"               --notes "Build de distribution No-de Vibe Designer $APP_VERSION."               || gh release view "$TAG" >/dev/null
          fi

          upload_asset() {
            local file="$1"
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          upload_asset "dist/No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.zip"
          upload_asset "dist/No-de-Vibe-Designer-$APP_VERSION-macOS-arm64.dmg"
          upload_asset "dist/No-de-Vibe-Designer-macOS-arm64.zip"
          upload_asset "dist/No-de-Vibe-Designer-macOS-arm64.dmg"
          upload_asset "dist/SHA256SUMS-macOS.txt"
