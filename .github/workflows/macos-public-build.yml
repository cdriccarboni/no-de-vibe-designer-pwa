name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "desktop/**"
      - "mobile/**"
      - "studio/**"
      - "companion/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "build-info.json"
      - "shared/**"
      - ".github/workflows/macos-public-build.yml"

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve app version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' shared/version.js | head -1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Resolved No[co]de Vibe Designer $APP_VERSION"

      - name: Syntax check PWA runtime
        run: |
          node --check desktop/app.js
          node --check shared/device-manager.js
          node --check shared/surface-switcher.js

      - name: Prepare Electron wrapper
        shell: bash
        run: |
          cat > package.json <<JSON
          {
            "name": "no-de-vibe-designer-mac-public",
            "productName": "No[co]de Vibe Designer",
            "version": "$APP_VERSION",
            "private": true,
            "main": "electron/main.cjs",
            "devDependencies": {
              "electron": "33.4.11",
              "electron-builder": "25.1.8"
            },
            "build": {
              "appId": "fr.acousmatic.nodevibedesigner",
              "productName": "No[co]de Vibe Designer",
              "asar": true,
              "files": [
                "electron/**/*",
                "desktop/**/*",
                "shared/**/*",
                "mobile/**/*",
                "studio/**/*",
                "companion/**/*",
                "show/**/*",
                "manuel/**/*",
                "install/**/*",
                "src/**/*",
                "icons/**/*",
                "index.html",
                "manifest.webmanifest",
                "build-info.json",
                "package.json"
              ],
              "mac": {
                "category": "public.app-category.graphics-design",
                "identity": null,
                "target": [{"target":"dir","arch":["universal"]}]
              }
            }
          }
          JSON

          mkdir -p electron
          cat > electron/main.cjs <<'JS'
          const { app, BrowserWindow, shell, session } = require("electron");
          const http = require("http");
          const fs = require("fs");
          const path = require("path");

          let server;

          function root() {
            return app.isPackaged
              ? path.join(process.resourcesPath, "app.asar")
              : path.join(__dirname, "..");
          }

          function contentType(filePath) {
            const ext = path.extname(filePath).toLowerCase();
            return ({
              ".html": "text/html; charset=utf-8",
              ".js": "text/javascript; charset=utf-8",
              ".mjs": "text/javascript; charset=utf-8",
              ".css": "text/css; charset=utf-8",
              ".json": "application/json; charset=utf-8",
              ".svg": "image/svg+xml",
              ".png": "image/png",
              ".jpg": "image/jpeg",
              ".jpeg": "image/jpeg",
              ".webmanifest": "application/manifest+json"
            })[ext] || "application/octet-stream";
          }

          function startLocalServer() {
            const appRoot = root();
            return new Promise((resolve, reject) => {
              server = http.createServer((req, res) => {
                let rel = decodeURIComponent((req.url || "/").split("?")[0])
                  .replace(/^\/+/, "") || "index.html";
                let filePath = path.normalize(path.join(appRoot, rel));

                if (!filePath.startsWith(path.normalize(appRoot))) {
                  res.writeHead(403);
                  return res.end("Forbidden");
                }

                try {
                  if (fs.statSync(filePath).isDirectory()) {
                    filePath = path.join(filePath, "index.html");
                  }
                } catch {}

                if (!fs.existsSync(filePath)) {
                  res.writeHead(404);
                  return res.end("Not found");
                }

                res.writeHead(200, {
                  "Content-Type": contentType(filePath),
                  "Cache-Control": "no-cache"
                });
                fs.createReadStream(filePath).pipe(res);
              });

              server.on("error", reject);
              server.listen(17654, "127.0.0.1", () => resolve(server.address().port));
            });
          }

          async function createWindow() {
            const port = await startLocalServer();
            const localOrigin = "http://127.0.0.1:" + port;

            const win = new BrowserWindow({
              width: 1440,
              height: 930,
              minWidth: 1024,
              minHeight: 700,
              title: "No[co]de Vibe Designer",
              backgroundColor: "#101214",
              titleBarStyle: "hiddenInset",
              trafficLightPosition: { x: 14, y: 16 },
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            session.defaultSession.setPermissionRequestHandler((_wc, permission, callback) => {
              callback(
                permission === "media" ||
                permission === "geolocation" ||
                permission === "notifications"
              );
            });

            await win.loadURL(localOrigin + "/desktop/");

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith(localOrigin + "/")) return { action: "allow" };
              shell.openExternal(url);
              return { action: "deny" };
            });
          }

          if (app.requestSingleInstanceLock()) app.whenReady().then(createWindow); else app.quit();

          app.on("window-all-closed", () => {
            try { server?.close(); } catch {}
            app.quit();
          });
          JS

          npm install --no-audit --no-fund

      - name: Build unpacked Universal macOS app
        run: npx electron-builder --mac dir --universal --publish never

      - name: Detect Apple Developer ID configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_CERTIFICATE_P12_BASE64:-}" && -n "${APPLE_CERTIFICATE_PASSWORD:-}" && -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "APPLE_SIGNING_READY=1" >> "$GITHUB_ENV"
            echo "Developer ID + notarization configuration detected."
          else
            echo "APPLE_SIGNING_READY=0" >> "$GITHUB_ENV"
            echo "Apple signing secrets incomplete: fallback to ad-hoc test build."
          fi

      - name: Import Developer ID certificate
        if: env.APPLE_SIGNING_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/no-de-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign complete ARM64 bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="dist/mac-universal/No[co]de Vibe Designer.app"

          test -d "$APP_DIR"
          xattr -cr "$APP_DIR" || true

          if [[ "${APPLE_SIGNING_READY:-0}" == "1" ]]; then
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP_DIR"
            echo "Developer ID" > macos-signing.txt
          else
            codesign --force --deep --sign - --timestamp=none "$APP_DIR"
            echo "ad-hoc" > macos-signing.txt
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          MAIN_BIN="$APP_DIR/Contents/MacOS/No[co]de Vibe Designer"
          file "$MAIN_BIN" | tee macos-architecture.txt
          lipo -info "$MAIN_BIN" | grep -q "arm64"
          lipo -info "$MAIN_BIN" | grep -q "x86_64"

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_DIR/Contents/Info.plist" | grep -qx "fr.acousmatic.nodevibedesigner"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_DIR/Contents/Info.plist" | grep -qx "$APP_VERSION"

      - name: Notarize and staple Developer ID app
        if: env.APPLE_SIGNING_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="dist/mac-universal/No[co]de Vibe Designer.app"
          NOTARY_ZIP="$RUNNER_TEMP/No-de-Vibe-Designer-notary.zip"

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_DIR"
          xcrun stapler validate "$APP_DIR"
          spctl --assess --type execute --verbose=4 "$APP_DIR"

      - name: Smoke-test signed app startup
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="dist/mac-universal/No[co]de Vibe Designer.app"
          LOG="$RUNNER_TEMP/no-de-startup.log"

          ELECTRON_ENABLE_LOGGING=1 "$APP_DIR/Contents/MacOS/No[co]de Vibe Designer" >"$LOG" 2>&1 &
          PID=$!

          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Application exited during startup."
            cat "$LOG" || true
            exit 1
          fi

          kill "$PID" || true
          wait "$PID" || true
          tail -200 "$LOG" || true

      - name: Package signed ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="dist/mac-universal/No[co]de Vibe Designer.app"
          ZIP="dist/No-de-Vibe-Designer-$APP_VERSION-macOS-universal.zip"
          DMG="dist/No-de-Vibe-Designer-$APP_VERSION-macOS-universal.dmg"
          STAGE="$RUNNER_TEMP/no-de-dmg"

          rm -rf "$STAGE" "$ZIP" "$DMG"
          mkdir -p "$STAGE"

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$ZIP"
          ditto "$APP_DIR" "$STAGE/No[co]de Vibe Designer.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create             -volname "No[co]de Vibe Designer"             -srcfolder "$STAGE"             -ov             -format UDZO             "$DMG"

          test -s "$ZIP"
          test -s "$DMG"

          if [[ "${APPLE_SIGNING_READY:-0}" == "1" ]]; then
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
            codesign --verify --verbose=2 "$DMG"
          fi

      - name: Verify packaged artifacts
        shell: bash
        run: |
          set -euo pipefail

          TMP_ZIP="$RUNNER_TEMP/no-de-zip-check"
          TMP_DMG="$RUNNER_TEMP/no-de-dmg-check"
          ZIP="dist/No-de-Vibe-Designer-$APP_VERSION-macOS-universal.zip"
          DMG="dist/No-de-Vibe-Designer-$APP_VERSION-macOS-universal.dmg"

          rm -rf "$TMP_ZIP" "$TMP_DMG"
          mkdir -p "$TMP_ZIP" "$TMP_DMG"

          ditto -x -k "$ZIP" "$TMP_ZIP"
          ZIP_APP="$TMP_ZIP/No[co]de Vibe Designer.app"
          codesign --verify --deep --strict --verbose=2 "$ZIP_APP"
          lipo -info "$ZIP_APP/Contents/MacOS/No[co]de Vibe Designer" | grep -q "arm64"
          lipo -info "$ZIP_APP/Contents/MacOS/No[co]de Vibe Designer" | grep -q "x86_64"

          MOUNT_POINT="$(hdiutil attach "$DMG" -readonly -nobrowse | tail -1 | awk '{for(i=3;i<=NF;i++) printf "%s%s",$i,(i<NF?OFS:"") }')"
          test -d "$MOUNT_POINT/No[co]de Vibe Designer.app"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/No[co]de Vibe Designer.app"
          lipo -info "$MOUNT_POINT/No[co]de Vibe Designer.app/Contents/MacOS/No[co]de Vibe Designer" | grep -q "arm64"
          lipo -info "$MOUNT_POINT/No[co]de Vibe Designer.app/Contents/MacOS/No[co]de Vibe Designer" | grep -q "x86_64"
          hdiutil detach "$MOUNT_POINT"

      - name: Prepare stable aliases and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "dist/No-de-Vibe-Designer-$APP_VERSION-macOS-universal.zip" "dist/No-de-Vibe-Designer-macOS-universal.zip"
          cp "dist/No-de-Vibe-Designer-$APP_VERSION-macOS-universal.dmg" "dist/No-de-Vibe-Designer-macOS-universal.dmg"

          cd dist
          shasum -a 256             "No-de-Vibe-Designer-$APP_VERSION-macOS-universal.zip"             "No-de-Vibe-Designer-$APP_VERSION-macOS-universal.dmg"             "No-de-Vibe-Designer-macOS-universal.zip"             "No-de-Vibe-Designer-macOS-universal.dmg"             > SHA256SUMS-macOS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: No-de-Vibe-Designer-${{ env.APP_VERSION }}-macOS-universal
          path: |
            dist/No-de-Vibe-Designer-${{ env.APP_VERSION }}-macOS-universal.zip
            dist/No-de-Vibe-Designer-${{ env.APP_VERSION }}-macOS-universal.dmg
            dist/No-de-Vibe-Designer-macOS-universal.zip
            dist/No-de-Vibe-Designer-macOS-universal.dmg
            dist/SHA256SUMS-macOS.txt
            macos-architecture.txt
            macos-signing.txt
          if-no-files-found: error

      - name: Create or refresh GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$APP_VERSION"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "No[co]de Vibe Designer $APP_VERSION"               --notes "Build de distribution No[co]de Vibe Designer $APP_VERSION."               || gh release view "$TAG" >/dev/null
          fi

          upload_asset() {
            local file="$1"
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          upload_asset "dist/No-de-Vibe-Designer-$APP_VERSION-macOS-universal.zip"
          upload_asset "dist/No-de-Vibe-Designer-$APP_VERSION-macOS-universal.dmg"
          upload_asset "dist/No-de-Vibe-Designer-macOS-universal.zip"
          upload_asset "dist/No-de-Vibe-Designer-macOS-universal.dmg"
          upload_asset "dist/SHA256SUMS-macOS.txt"
