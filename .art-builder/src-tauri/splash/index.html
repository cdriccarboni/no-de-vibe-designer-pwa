<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>ART — Acousmatic Régie Tools</title><style>html,body{margin:0;height:100%;background:#000;color:#f4f4f0}body{display:grid;place-items:center;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}main{display:grid;justify-items:center;gap:18px;text-align:center}.mark{width:112px;height:112px}.brand{display:grid;gap:4px}.brand strong{font-size:34px;line-height:1;letter-spacing:-.04em}.brand span{font-size:16px;line-height:1.2;opacity:.76}#offline{display:none;max-width:340px;opacity:.85}#offline button{margin-top:12px;min-height:40px;padding:0 18px;border:1px solid rgba(244,244,240,.3);border-radius:12px;background:rgba(244,244,240,.06);color:inherit;font:inherit;cursor:pointer}body.offline #offline{display:block}</style></head><body><main><img class="mark" src="art-icon.png" alt="ART"><div class="brand"><strong>ART</strong><span>Acousmatic Régie Tools</span></div><div id="offline" role="status">Connexion à ART impossible pour le moment.<br>Vérifiez le réseau puis réessayez.<br><button id="retry" type="button">Réessayer</button></div></main><script>var ART_URL="https://art.acousmatic-theatre.fr/?native_shell=tauri";function openArt(){document.body.classList.remove("offline");setTimeout(function(){location.replace(ART_URL)},120);setTimeout(function(){document.body.classList.add("offline")},12000)}document.getElementById("retry").addEventListener("click",openArt);openArt();</script></body></html>
