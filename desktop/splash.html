<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>No[co]de Vibe Designer</title>
  <style>
    body { margin: 0; background: #090d16; color: #f8fafc; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    .logo { width: 80px; height: 80px; margin-bottom: 20px; border-radius: 18px; overflow: hidden; }
    .logo svg { width: 100%; height: 100%; display: block; }
    h1 { font-size: 22px; margin: 0 0 6px 0; }
    .version { font-size: 13px; color: #00e5ff; background: #0f172a; padding: 3px 10px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #1e293b; }
    .loader { width: 220px; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
    .fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00e5ff, #b026ff); animation: load 1.4s infinite; transform-origin: left; }
    @keyframes load { 0% { transform: scaleX(0); } 50% { transform: scaleX(0.7); } 100% { transform: scaleX(1); } }
  </style>
</head>
<body>
  <div class="logo"><img class="nocode-mark" src="../icons/nocode-rings.svg" alt="" width="80" height="80"></div>
  <h1>No[co]de Vibe Designer</h1>
  <div class="version" id="appVersion"></div>
  <script type="module">
    import { APP_VERSION } from "../shared/version.js";
    document.getElementById("appVersion").textContent = `v${APP_VERSION}`;
  </script>
  <div class="loader"><div class="fill"></div></div>
  <div style="font-size:11px;color:#64748b;">Chargement Moteur DAG & Acceleration Metal M4...</div>
</body>
</html>
