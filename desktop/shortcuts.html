<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Raccourcis Régie</title>
  <link rel="icon" href="../mobile/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../mobile/icons/icon-192.png">
  <meta property="og:title" content="No[co]de Vibe Designer">
  <meta property="og:image" content="https://cdriccarboni.github.io/no-de-vibe-designer-pwa/icons/icon-512.png">
  <style>
    body { font-family: -apple-system, sans-serif; background: #090d16; color: #f8fafc; padding: 32px; }
    .header { border-bottom: 2px solid #00e5ff; padding-bottom: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; }
    .brandmark{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none}.brandmark svg{width:100%;height:100%;display:block}
    .header-title{display:flex;align-items:center;gap:12px}
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #0f172a; border: 1px solid #1e293b; padding: 16px; border-radius: 8px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; }
    .kbd { background: #1e293b; color: #00e5ff; padding: 3px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title"><span class="brandmark" aria-hidden="true"><svg class="nocode-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" fill="#0f1113"/><path fill="#8fa79d" fill-rule="evenodd" d="M50 4 L96 50 L50 96 L4 50 Z M50 12 L88 50 L50 88 L12 50 Z"/><circle cx="50" cy="50" r="34" fill="#d7b86a"/><g stroke="#8a8378" stroke-width="0.6" opacity="0.45" fill="none"><path d="M20 42 H32"/><path d="M68 42 H80"/><path d="M24 58 H36"/><path d="M64 64 H78"/></g><text x="50" y="46" text-anchor="middle" fill="#2a2418" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700"><tspan x="50" font-size="10">No</tspan><tspan font-size="6.2">[co]</tspan><tspan font-size="10">de</tspan><tspan x="50" dy="9" font-size="8">Vibe</tspan><tspan x="50" dy="8" font-size="7">Designer</tspan></text></svg></span><h1 style="color:#00e5ff;margin:0;">No[co]de Vibe Designer — Raccourcis Régie</h1></div>
    <span id="appVersion" style="color:#38bdf8;"></span>
  </div>
  <div class="grid">
    <div class="card">
      <h3 style="color:#38bdf8;margin-top:0;">Urgence & Conduite</h3>
      <div class="row"><span>Blackout Urgence</span><span class="kbd">Cmd + B</span></div>
      <div class="row"><span>Show Lock</span><span class="kbd">Cmd + L</span></div>
      <div class="row"><span>Cue Suivante (GO)</span><span class="kbd">Flèche Droite / Espace</span></div>
      <div class="row"><span>Cue Précédente</span><span class="kbd">Flèche Gauche</span></div>
    </div>
    <div class="card">
      <div class="row"><span>Pipette Couleur</span><span class="kbd">P</span></div>
      <div class="row"><span>Dessin Masque</span><span class="kbd">M</span></div>
      <div class="row"><span>Chat Vibe</span><span class="kbd">Cmd + K</span></div>
    </div>
  </div>
  <script type="module">
    import { APP_VERSION } from "../shared/version.js";
    document.title = `Raccourcis Régie v${APP_VERSION}`;
    document.getElementById("appVersion").textContent = `v${APP_VERSION} ARM64`;
  </script>
</body>
</html>
