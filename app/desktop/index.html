<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No-de Vibe Designer</title><link rel="stylesheet" href="./styles.css"></head>
<body><div id="app">
<header class="topbar"><div class="brand"><span class="brandmark">◒</span><div><b>No-de Vibe Designer</b><small>NO-CODE · NODE · STAGE</small></div></div><span id="versionBadge" class="badge">0.8.0</span><div class="spacer"></div><button id="newBtn">Nouveau</button><button id="openBtn">Ouvrir</button><button id="saveBtn">Enregistrer</button><button id="exportMaxBtn">Max/MSP</button><button id="exportTdBtn">TouchDesigner</button></header>
<main class="workspace">
<aside class="panel library"><div class="panel-head">Library <span class="muted">fonctionnelle</span></div><input id="librarySearch" class="search" placeholder="Rechercher un node…"><div id="libraryList" class="scroll"></div></aside>
<section class="center">
<section class="panel canvas-panel"><div class="canvas-toolbar"><div id="breadcrumbs" class="breadcrumbs"></div><div class="spacer"></div><button id="parentBtn">↑</button><button id="rootBtn">⌂</button><button id="undoBtn">↶</button><button id="redoBtn">↷</button><button id="duplicateBtn">Dupliquer</button><button id="deleteBtn">Supprimer</button><button id="zoomOutBtn">−</button><span id="zoomLabel">100%</span><button id="zoomInBtn">＋</button></div><div id="canvasViewport" class="canvas-viewport"><div id="canvasWorld" class="canvas-world"><svg id="wireLayer" class="wires"></svg><div id="nodeLayer"></div></div></div><div id="connectionHint" class="connection-hint hidden"></div></section>
<section class="lower-grid"><section class="panel preview-panel"><div class="panel-head">Preview <span id="previewState" class="live">● LIVE</span></div><canvas id="previewCanvas" width="960" height="540"></canvas></section><section class="panel timeline-panel"><div class="panel-head"><span>Timeline / Cues</span><div class="spacer"></div><button id="addCueBtn">＋ Cue</button><button id="goBtn" class="go">GO</button></div><div id="cueList" class="cue-list"></div></section></section>
<section class="panel vibe-panel"><div class="panel-head">Vibe <span class="muted">Entrée = exécuter · Maj+Entrée = nouvelle ligne</span></div><textarea id="vibeText" placeholder="Décris ce que tu veux créer ou modifier…"></textarea><div id="vibeStatus" class="vibe-status">Prêt.</div></section>
</section>
<aside class="panel inspector"><div class="panel-head">Inspector <span id="selectionCount" class="muted"></span></div><div id="inspectorBody" class="scroll inspector-body"><p class="muted">Sélectionne un node.</p></div></aside>
</main>
<section id="terminalPanel" class="terminal panel"><div class="terminal-head"><span>Terminal / OUTPUT</span><span id="engineStatus" class="ok">● ENGINE</span><div class="spacer"></div><button id="clearLogBtn">Effacer</button><button id="terminalToggle">−</button></div><div id="log" class="log"></div></section>
</div><script type="module" src="./app.js"></script></body></html>
