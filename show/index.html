<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No[co]de Vibe Designer</title>
<link rel="icon" href="../mobile/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../mobile/icons/icon-192.png">
<meta property="og:title" content="No[co]de Vibe Designer">
<meta property="og:image" content="https://cdriccarboni.github.io/no-de-vibe-designer-pwa/icons/icon-512.png">
<link rel="stylesheet" href="./show.css">
  <script type="module">
    import { installSurfaceSwitcher } from "../shared/surface-switcher.js";
    window.addEventListener("DOMContentLoaded", () => installSurfaceSwitcher());
  </script>
</head>
<body>
<aside>
  <div class="brand-lockup"><span class="brandmark" aria-hidden="true"><svg class="nocode-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" fill="#0f1113"/><path fill="#8fa79d" fill-rule="evenodd" d="M50 4 L96 50 L50 96 L4 50 Z M50 12 L88 50 L50 88 L12 50 Z"/><circle cx="50" cy="50" r="34" fill="#d7b86a"/><g stroke="#8a8378" stroke-width="0.6" opacity="0.45" fill="none"><path d="M20 42 H32"/><path d="M68 42 H80"/><path d="M24 58 H36"/><path d="M64 64 H78"/></g><text x="50" y="46" text-anchor="middle" fill="#2a2418" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700"><tspan x="50" font-size="10">No</tspan><tspan font-size="6.2">[co]</tspan><tspan font-size="10">de</tspan><tspan x="50" dy="9" font-size="8">Vibe</tspan><tspan x="50" dy="8" font-size="7">Designer</tspan></text></svg></span><p class="brand">No<span class="co">[co]</span>de Vibe Designer</p></div>
  <p class="nav"><a href="../desktop/index.html">Designer</a> · <b>Show</b></p>
  <h1>Chat</h1>
  <p id="cxNote"></p>
  <p id="native"></p>
  <textarea id="chat" rows="5" placeholder="Décris le patch à modifier"></textarea>
  <button id="ask" type="button">Envoyer</button>
  <p id="log"></p>
</aside>
<main>
  <header>
    <b id="sceneName">Scène</b>
    <span id="runState">Arrêt</span>
    <span id="clock">0.00 s</span>
    <span id="bound"></span>
  </header>
  <div class="transport">
    <label>Ouvrir <input id="openFile" type="file" accept=".json,application/json"></label>
    <button id="loadScene" type="button">Charger la scène</button>
    <button id="start" type="button">Lecture</button>
    <button id="pause" type="button">Pause</button>
    <button id="stop" type="button">Stop</button>
    <button id="go" type="button">Cue</button>
    <button id="save" type="button">Enregistrer</button>
    <button id="restore" type="button">Restaurer</button>
  </div>
  <canvas id="preview" width="320" height="180" aria-label="Aperçu shader"></canvas>
  <canvas id="monitor" width="680" height="240" aria-label="Moniteur Show"></canvas>
  <pre id="timeline"></pre>
  <form class="curve">
    <span>Courbe · opacité</span>
    <label>temps <input id="keyTime" type="number" step="0.1" value="1"></label>
    <label>valeur <input id="keyValue" type="number" step="0.05" min="0" max="1" value="0.5"></label>
    <label>interpolation <select id="keyEase"><option>linear</option><option>ease-in</option><option>ease-out</option></select></label>
    <button id="addKey" type="button">Point</button>
  </form>
</main>
<script type="module" src="./show.js"></script>
</body>
</html>
