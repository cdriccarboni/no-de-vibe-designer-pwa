<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>No-de · Companion Studio</title>
  <link rel="stylesheet" href="./studio.css" />
  <script type="module" src="./studio.js" defer></script>
</head>
<body>
  <header class="cs-head">
    <div>
      <p class="brand">No-de Companion Studio</p>
      <p id="netStatus" class="net">DISCONNECTED</p>
    </div>
    <div class="modes" role="tablist">
      <button type="button" data-mode="EDITION" class="active">Édition</button>
      <button type="button" data-mode="TEST">Test</button>
      <button type="button" data-mode="PLATEAU">Plateau</button>
    </div>
  </header>

  <section class="cs-connect">
    <label>Pont WS <input id="wsUrl" type="url" placeholder="ws://192.168.x.x:4174" autocomplete="off" /></label>
    <label>Code pair <input id="pairCode" type="text" maxlength="8" placeholder="optionnel" autocomplete="off" /></label>
    <div class="row">
      <button type="button" id="btnConnect">Connecter</button>
      <button type="button" id="btnDisconnect" class="ghost">Déconnecter</button>
      <button type="button" id="btnSave" class="ghost">Sauver layout</button>
    </div>
  </section>

  <main>
    <div id="grid" class="cs-grid" aria-label="Surface Companion"></div>
    <aside id="editor" class="cs-editor">
      <h2>Widget</h2>
      <p class="hint">Action / Binding / Presentation séparés — l’apparence ne casse pas le patch.</p>
      <label>Nom <input id="edLabel" type="text" /></label>
      <label>Secondaire <input id="edSecondary" type="text" /></label>
      <label>Couleur <input id="edColor" type="color" value="#d7b86a" /></label>
      <label>Binding
        <select id="edBinding">
          <option value="action:ping">Action · ping (feedback)</option>
          <option value="stage:go">Stage · GO</option>
          <option value="stage:prev">Stage · Prev</option>
          <option value="stage:next">Stage · Next</option>
        </select>
      </label>
      <div class="row">
        <button type="button" id="edApply">Appliquer</button>
        <button type="button" id="edAdd" class="ghost">＋ Bouton</button>
      </div>
      <pre id="log" class="log"></pre>
    </aside>
  </main>
</body>
</html>
